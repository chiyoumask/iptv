name: 更新 IPTV 直播源

# ⚠️ 定时解析已停用：GitHub Actions runner 的 IP 被 YouTube 风控，
# 云端始终解析不到台湾源。主流程改为本地手动运行 tv.py 后推送。
# 本 workflow 仅保留 workflow_dispatch，作为日后云端连通性的可选自检，
# 不再做任何 commit/push，避免空跑覆盖本地手动推送的有效结果。
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖（yt-dlp）
        run: pip install -r requirements.txt

      - name: 本地解析验证（不提交）
        run: python tv.py
