name: 更新 IPTV 直播源

# 触发条件：每 6 小时定时 + 支持手动触发
on:
  schedule:
    # UTC 时间 0/6/12/18 点 = 北京时间 8/14/20/2 点
    - cron: '0 */6 * * *'
  workflow_dispatch:  # 允许在 GitHub 页面手动点击运行，便于首次验证

# 让默认 GITHUB_TOKEN 有权推送回仓库
permissions:
  contents: write

concurrency:
  group: update-iptv
  cancel-in-progress: false  # 不取消正在运行的任务，避免解析到一半被打断

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖（yt-dlp）
        run: pip install -r requirements.txt

      - name: 运行解析脚本
        run: python tv.py

      - name: 提交并推送更新的 m3u
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV3.m3u
          # 若有改动才提交；无改动则跳过，避免空提交报错
          if git diff --cached --quiet; then
            echo "IPTV3.m3u 无变化，跳过提交。"
          else
            git commit -m "自动更新 IPTV 直播源 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
